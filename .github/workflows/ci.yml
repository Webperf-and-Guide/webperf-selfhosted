name: ci

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  js:
    name: JS, contracts, and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Cache Bun packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: bun run compose:config

  docs:
    name: Documentation links and paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Cache Bun packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run check:docs

  rust:
    name: Rust fmt, clippy, tests, and linux/amd64 image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: 1.86.0
          components: rustfmt, clippy
      - name: Cache Cargo dependencies and build outputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/probe-rs/target
          key: rust-${{ runner.os }}-1.86-${{ hashFiles('apps/probe-rs/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-1.86-
      - run: cargo fmt --all --check
        working-directory: apps/probe-rs
      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: apps/probe-rs
      - run: cargo test --workspace
        working-directory: apps/probe-rs
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./apps/probe-rs
          file: ./apps/probe-rs/Dockerfile
          platforms: linux/amd64
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=ci-probe
          cache-to: type=gha,mode=max,scope=ci-probe

  images:
    name: Image ${{ matrix.name }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: console
            file: apps/console/Dockerfile
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - name: api
            file: apps/api/Dockerfile
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - name: scheduler
            file: apps/scheduler/Dockerfile
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - name: executor
            file: apps/executor/Dockerfile
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - name: browser-audit-lighthouse
            file: apps/browser-audit-lighthouse/Dockerfile
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - name: browser-audit-lighthouse
            file: apps/browser-audit-lighthouse/Dockerfile
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=ci-${{ matrix.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.name }}-${{ matrix.arch }}

  integration:
    name: Compose smoke (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: default
            command: smoke:compose
          - profile: browser-audit
            command: smoke:compose:browser-audit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Cache Bun packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - run: bun install --frozen-lockfile
      - name: Load Browser Audit AppArmor profile
        if: ${{ matrix.profile == 'browser-audit' }}
        run: sudo apparmor_parser -r -W infra/docker-compose/browser-audit.apparmor
      - run: bun run "$COMMAND"
        env:
          COMMAND: ${{ matrix.command }}
      - name: Report Browser Audit sandbox denials
        if: ${{ failure() && matrix.profile == 'browser-audit' }}
        run: |
          set -o pipefail
          {
            sudo journalctl --dmesg --no-pager --since '-20 minutes' 2>/dev/null || true
            sudo dmesg 2>/dev/null || true
            sudo tail -n 2000 /var/log/kern.log /var/log/syslog 2>/dev/null || true
          } | grep -E 'apparmor="(AUDIT|DENIED)"|audit:.*(SECCOMP|userns)' | tail -n 200 || true

  required:
    name: Required CI
    if: ${{ always() }}
    needs: [js, docs, rust, images, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every CI job
        env:
          JS_RESULT: ${{ needs.js.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          IMAGES_RESULT: ${{ needs.images.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          set -euo pipefail
          for result in "$JS_RESULT" "$DOCS_RESULT" "$RUST_RESULT" "$IMAGES_RESULT" "$INTEGRATION_RESULT"; do
            test "$result" = "success"
          done

  publish-dev-images:
    name: Publish dev image ${{ matrix.name }}
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: required
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: console
            image: webperf-console
            context: .
            file: apps/console/Dockerfile
          - name: api
            image: webperf-api
            context: .
            file: apps/api/Dockerfile
          - name: scheduler
            image: webperf-scheduler
            context: .
            file: apps/scheduler/Dockerfile
          - name: executor
            image: webperf-executor
            context: .
            file: apps/executor/Dockerfile
          - name: probe
            image: webperf-probe
            context: ./apps/probe-rs
            file: ./apps/probe-rs/Dockerfile
          - name: browser-audit-lighthouse
            image: webperf-browser-audit-lighthouse
            context: .
            file: apps/browser-audit-lighthouse/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          # `main` is an explicitly mutable development channel. Production
          # installs use immutable release versions or digest-pinned bundles.
          tags: |
            ghcr.io/webperf-and-guide/${{ matrix.image }}:main
            ghcr.io/webperf-and-guide/${{ matrix.image }}:sha-${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=ci-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.name }}
