# Phase 2 of issue #14: all Bun services share one webperf image build.
# Every Bun service defines the same build so compose up --build builds it
# once (BuildKit cache) and reuses the result. Without build: on each
# service, compose tries to pull the local-only :dev tag from a registry.
x-webperf-build: &webperf-build
  context: ../..
  dockerfile: infra/docker/Dockerfile.webperf

services:
  webperf:
    image: webperf:dev
    build: *webperf-build

  scheduler:
    image: webperf:dev
    build: *webperf-build

  probe:
    image: webperf-probe:dev
    build:
      context: ../../apps/probe-rs
      dockerfile: Dockerfile

  browser-audit-lighthouse:
    image: webperf-browser-audit-lighthouse:dev
    build:
      context: ../..
      dockerfile: apps/browser-audit-lighthouse/Dockerfile

  api-debug:
    image: webperf:dev
    build: *webperf-build

  browser-audit-debug:
    image: webperf:dev
    build: *webperf-build
