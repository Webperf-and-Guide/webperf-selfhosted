name: release-pr

on:
  push:
    branches: [main]
    paths:
      - '.sampo/changesets/**'
      - '.sampo/config.toml'
      - 'VERSION'
      - 'CHANGELOG.md'
      - 'infra/docker-compose/.env.example'
      - 'package.json'
      - 'bun.lock'
      - 'packages/**/package.json'
  workflow_dispatch:

concurrency:
  # Runs are intentionally coalescible: every surviving run reconciles the
  # current VERSION and its first-parent source before preparing newer changes.
  group: release-pr-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare or dispatch release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Require main release preparation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo 'Release preparation may run only from main.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Cache Bun packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Resolve current repository release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(
            bun tooling/scripts/release-bundle.ts repository-version \
              | jq -er '.version'
          )"
          source_sha="$(git rev-list --first-parent -1 HEAD -- VERSION)"
          if [[ ! "$source_sha" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            echo 'Cannot resolve the main commit that prepared VERSION.' >&2
            exit 1
          fi
          if [[ "$(git show "${source_sha}:VERSION")" != "$version" ]]; then
            echo 'The prepared release source does not contain the current VERSION.' >&2
            exit 1
          fi
          if git diff --quiet "${source_sha}^1" "$source_sha" -- VERSION; then
            echo 'The prepared release source did not change VERSION.' >&2
            exit 1
          fi

          tag="v${version}"
          dispatch=true
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            dispatch=false
          else
            export RELEASE_RUN_TITLE="release ${tag}"
            active_release_count="$(
              gh run list \
                --workflow release.yml \
                --limit 100 \
                --json displayTitle,status \
                --jq '
                  map(
                    select(
                      .displayTitle == env.RELEASE_RUN_TITLE
                      and .status != "completed"
                    )
                  ) | length
                '
            )"
            if [[ "$active_release_count" != '0' ]]; then
              dispatch=false
            fi
          fi

          echo "dispatch=${dispatch}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
      - name: Dispatch protected formal release
        if: ${{ steps.release.outputs.dispatch == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          VERSION: ${{ steps.release.outputs.version }}
        # workflow_dispatch is explicit because GITHUB_TOKEN-authored tag pushes
        # do not recursively start another release workflow.
        run: >-
          gh workflow run release.yml --ref main
          -f "version=${VERSION}"
          -f "source_sha=${SOURCE_SHA}"
      - name: Detect pending Sampo changesets
        id: changesets
        shell: bash
        run: |
          set -euo pipefail
          if find .sampo/changesets -maxdepth 1 -type f -name '*.md' -print -quit | grep -q .; then
            echo 'pending=true' >> "$GITHUB_OUTPUT"
          else
            echo 'pending=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare repository version and changelog
        if: ${{ steps.changesets.outputs.pending == 'true' }}
        run: bun tooling/scripts/release-bundle.ts prepare-repository-release
      - name: Apply pending Sampo changesets
        if: ${{ steps.changesets.outputs.pending == 'true' }}
        env:
          SAMPO_RELEASE_BRANCH: main
        run: bun run sampo:release
      - name: Synchronize the Bun lockfile
        if: ${{ steps.changesets.outputs.pending == 'true' }}
        run: bun install --lockfile-only
      - name: Validate generated release state
        if: ${{ steps.changesets.outputs.pending == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if find .sampo/changesets -maxdepth 1 -type f -name '*.md' -print -quit | grep -q .; then
            echo 'Sampo left pending changesets after release preparation.' >&2
            exit 1
          fi
          bun run check:release
      - name: Create or update Sampo release PR
        if: ${{ steps.changesets.outputs.pending == 'true' }}
        id: release_pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: release/sampo
          delete-branch: true
          commit-message: 'chore(release): prepare WebPerf version'
          title: 'chore(release): prepare WebPerf version'
          body: |
            Sampo-generated release preparation.

            - consumes every pending `.sampo/changesets/*.md`
            - updates affected public package versions and changelogs
            - advances the independent repository `VERSION` and root changelog
            - leaves registry publication to the protected WebPerf release workflow

            Merge only after Required CI passes. The merge will dispatch the matching
            formal WebPerf release when no `v<version>` tag exists yet.
      - name: Ensure Required CI for the release PR
        if: >-
          ${{ steps.changesets.outputs.pending == 'true'
              && steps.release_pr.outputs.pull-request-operation != 'closed' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST_OPERATION: ${{ steps.release_pr.outputs.pull-request-operation }}
          RELEASE_PR_BRANCH: release/sampo
        shell: bash
        run: |
          set -euo pipefail
          case "$PULL_REQUEST_OPERATION" in
            created|updated)
              ;;
            none)
              head_sha="$(
                git ls-remote origin "refs/heads/${RELEASE_PR_BRANCH}" \
                  | awk 'NR == 1 { print $1 }'
              )"
              if [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
                echo "Cannot resolve the existing release PR head." >&2
                exit 1
              fi
              run_state="$(
                gh run list \
                  --workflow ci.yml \
                  --branch "$RELEASE_PR_BRANCH" \
                  --commit "$head_sha" \
                  --limit 100 \
                  --json status,conclusion \
                  --jq '
                    if any(.[]; .status != "completed") then "active"
                    elif any(.[]; .conclusion == "success") then "passed"
                    else "retry"
                    end
                  '
              )"
              if [[ "$run_state" = 'active' || "$run_state" = 'passed' ]]; then
                exit 0
              fi
              ;;
            *)
              echo "Unexpected release PR operation: ${PULL_REQUEST_OPERATION}" >&2
              exit 1
              ;;
          esac
          gh workflow run ci.yml --ref "$RELEASE_PR_BRANCH"
