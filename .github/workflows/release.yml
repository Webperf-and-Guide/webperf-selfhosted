name: release
run-name: release ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Public beta version to release (for example, 0.2.0)'
        required: true
        type: string
      source_sha:
        description: 'Exact prepared main commit to release'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      source_sha: ${{ steps.release.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Validate tag, ancestry, and Sampo state
        id: release
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          if [[ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]]; then
            test "$GITHUB_REF" = 'refs/heads/main'
            if [[ ! "$REQUESTED_SOURCE_SHA" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
              echo 'source_sha must be a full lowercase Git commit ID.' >&2
              exit 1
            fi
            if [[ "$source_sha" != "$REQUESTED_SOURCE_SHA" ]]; then
              echo 'The checked-out release source does not match source_sha.' >&2
              exit 1
            fi
            version="$REQUESTED_VERSION"
            tag="v${version}"
          else
            test "$GITHUB_REF_TYPE" = 'tag'
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
          fi
          bun tooling/scripts/release-bundle.ts validate-repository-version "$version"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$source_sha" refs/remotes/origin/main
          first_parent_match="$(
            git rev-list --first-parent refs/remotes/origin/main \
              | awk -v expected="$source_sha" '
                  $0 == expected { found = 1 }
                  END { if (found) print expected }
                '
          )"
          if [[ "$first_parent_match" != "$source_sha" ]]; then
            echo 'Release source must be on the main first-parent history.' >&2
            exit 1
          fi
          if ! git rev-parse "${source_sha}^1" >/dev/null 2>&1; then
            echo 'Release source must have a main parent.' >&2
            exit 1
          fi
          if git diff --quiet "${source_sha}^1" "$source_sha" -- VERSION; then
            echo 'Release source must be the main commit that changed VERSION.' >&2
            exit 1
          fi
          if find .sampo/changesets -maxdepth 1 -type f -name '*.md' -print -quit | grep -q .; then
            echo "Apply and commit every pending Sampo changeset before tagging a release." >&2
            exit 1
          fi
          bash tooling/scripts/release-tag.sh verify "$tag" "$source_sha" "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

  ci:
    name: Required CI before release
    needs: prepare
    permissions:
      contents: read
      # GitHub validates permission ceilings for every job in a reusable
      # workflow, including the conditionally skipped dev-image publisher.
      packages: write
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}

  authorize:
    name: Authorize protected release
    needs: [prepare, ci]
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Confirm protected environment approval
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        shell: bash
        run: test -n "$RELEASE_TAG" && test -n "$SOURCE_SHA"

  tag:
    name: Publish immutable release tag
    needs: [prepare, ci, authorize]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Create or verify release tag
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          bash tooling/scripts/release-tag.sh \
            publish "$RELEASE_TAG" "$SOURCE_SHA" "$VERSION"

  images:
    name: Publish release image ${{ matrix.name }}
    needs: [prepare, ci, tag]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: console
            image: webperf-console
            context: .
            file: apps/console/Dockerfile
          - name: api
            image: webperf-api
            context: .
            file: apps/api/Dockerfile
          - name: scheduler
            image: webperf-scheduler
            context: .
            file: apps/scheduler/Dockerfile
          - name: executor
            image: webperf-executor
            context: .
            file: apps/executor/Dockerfile
          - name: probe
            image: webperf-probe
            context: ./apps/probe-rs
            file: apps/probe-rs/Dockerfile
          - name: browser-audit-lighthouse
            image: webperf-browser-audit-lighthouse
            context: .
            file: apps/browser-audit-lighthouse/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/webperf-and-guide/${{ matrix.image }}:${{ needs.prepare.outputs.version }}
            ghcr.io/webperf-and-guide/${{ matrix.image }}:sha-${{ needs.prepare.outputs.source_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.source_sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          sbom: true
          provenance: mode=max
          cache-from: |
            type=gha,scope=ci-${{ matrix.name }}-amd64
            type=gha,scope=ci-${{ matrix.name }}-arm64
            type=gha,scope=release-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.name }}
      - name: Resolve published OCI platform manifests
        id: platform-digests
        env:
          IMAGE_REFERENCE: ghcr.io/webperf-and-guide/${{ matrix.image }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          for _attempt in $(seq 1 15); do
            if platform_manifests="$(
              docker buildx imagetools inspect --raw "${IMAGE_REFERENCE}@${IMAGE_DIGEST}" \
                | jq -cer '
                    [
                      .manifests[]?
                      | select(
                        .platform.os == "linux"
                        and (.platform.architecture == "amd64" or .platform.architecture == "arm64")
                      )
                      | {
                          platform: "\(.platform.os)/\(.platform.architecture)",
                          digest
                        }
                    ]
                    | group_by(.platform)
                    | if length == 2 and all(.[]; length == 1) then
                        map(.[0])
                        | sort_by(.platform)
                      else
                        error("published OCI index must contain one linux/amd64 and one linux/arm64 manifest")
                      end
                  '
            )"; then
              linux_amd64_digest="$(
                jq -er '.[] | select(.platform == "linux/amd64") | .digest' \
                  <<<"${platform_manifests}"
              )"
              linux_arm64_digest="$(
                jq -er '.[] | select(.platform == "linux/arm64") | .digest' \
                  <<<"${platform_manifests}"
              )"
              {
                printf 'linux_amd64_digest=%s\n' "$linux_amd64_digest"
                printf 'linux_arm64_digest=%s\n' "$linux_arm64_digest"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 2
          done
          printf '%s\n' "Published image is missing a required Linux platform: ${IMAGE_REFERENCE}@${IMAGE_DIGEST}" >&2
          exit 1
      - name: Prepare release outputs
        run: mkdir -p release-output
      - name: Generate linux/amd64 SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/webperf-and-guide/${{ matrix.image }}@${{ steps.platform-digests.outputs.linux_amd64_digest }}
          output-file: release-output/${{ matrix.name }}-${{ needs.prepare.outputs.version }}.spdx.json
          format: spdx-json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate linux/arm64 SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/webperf-and-guide/${{ matrix.image }}@${{ steps.platform-digests.outputs.linux_arm64_digest }}
          output-file: release-output/${{ matrix.name }}-${{ needs.prepare.outputs.version }}-linux-arm64.spdx.json
          format: spdx-json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest image provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ghcr.io/webperf-and-guide/${{ matrix.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Attest linux/amd64 image SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ghcr.io/webperf-and-guide/${{ matrix.image }}
          subject-digest: ${{ steps.platform-digests.outputs.linux_amd64_digest }}
          sbom-path: release-output/${{ matrix.name }}-${{ needs.prepare.outputs.version }}.spdx.json
          push-to-registry: true
      - name: Attest linux/arm64 image SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ghcr.io/webperf-and-guide/${{ matrix.image }}
          subject-digest: ${{ steps.platform-digests.outputs.linux_arm64_digest }}
          sbom-path: release-output/${{ matrix.name }}-${{ needs.prepare.outputs.version }}-linux-arm64.spdx.json
          push-to-registry: true
      - name: Record digest metadata
        env:
          IMAGE_NAME: ${{ matrix.name }}
          IMAGE_REPOSITORY: ghcr.io/webperf-and-guide/${{ matrix.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          LINUX_AMD64_DIGEST: ${{ steps.platform-digests.outputs.linux_amd64_digest }}
          LINUX_ARM64_DIGEST: ${{ steps.platform-digests.outputs.linux_arm64_digest }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          bun tooling/scripts/release-bundle.ts metadata \
            "$IMAGE_NAME" "$IMAGE_REPOSITORY" "$VERSION" \
            "$IMAGE_DIGEST" "$LINUX_AMD64_DIGEST" "$LINUX_ARM64_DIGEST" \
            "$SOURCE_SHA" release-output
      - name: Upload image release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.name }}
          path: release-output/
          if-no-files-found: error
          retention-days: 7

  bundle:
    name: Publish release bundle
    needs: [prepare, ci, tag, images]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Download image metadata and SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-input
          merge-multiple: true
      - name: Render deterministic release bundle
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          bundle_name="webperf-selfhosted-v${VERSION}"
          bun tooling/scripts/release-bundle.ts bundle \
            "$VERSION" release-input "dist/${bundle_name}"
          tar --sort=name --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -cf - -C dist "$bundle_name" \
            | gzip -n > "dist/${bundle_name}.tar.gz"
          (cd dist && sha256sum "${bundle_name}.tar.gz" > SHA256SUMS)
      - name: Attest release archive
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/webperf-selfhosted-v${{ needs.prepare.outputs.version }}.tar.gz
      - name: Upload release workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webperf-selfhosted-v${{ needs.prepare.outputs.version }}
          path: |
            dist/webperf-selfhosted-v${{ needs.prepare.outputs.version }}.tar.gz
            dist/SHA256SUMS
            dist/webperf-selfhosted-v${{ needs.prepare.outputs.version }}/compose.yml
            dist/webperf-selfhosted-v${{ needs.prepare.outputs.version }}/compose.apparmor.yml
            dist/webperf-selfhosted-v${{ needs.prepare.outputs.version }}/browser-audit.apparmor
            dist/webperf-selfhosted-v${{ needs.prepare.outputs.version }}/browser-audit-seccomp.json
            dist/webperf-selfhosted-v${{ needs.prepare.outputs.version }}/runtime-metadata.json
            release-input/*.spdx.json
          if-no-files-found: error
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          bundle_name="webperf-selfhosted-v${VERSION}"
          assets=(
            "dist/${bundle_name}.tar.gz"
            "dist/SHA256SUMS"
            "dist/${bundle_name}/compose.yml"
            "dist/${bundle_name}/compose.apparmor.yml"
            "dist/${bundle_name}/browser-audit.apparmor"
            "dist/${bundle_name}/browser-audit-seccomp.json"
            "dist/${bundle_name}/runtime-metadata.json"
            release-input/*.spdx.json
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag \
              --title "WebPerf ${VERSION}" \
              --generate-notes
          fi

  smoke-published-bundle:
    name: Smoke published release bundle
    needs: [prepare, bundle]
    permissions:
      contents: read
    uses: ./.github/workflows/release-bundle-smoke.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
