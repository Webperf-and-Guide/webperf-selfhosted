# Phase 2 of issue #14: all Bun services share one webperf image build.
# The x-webperf-build anchor avoids building the same Dockerfile four times.
x-webperf-build: &webperf-build
  context: ../..
  dockerfile: infra/docker/Dockerfile.webperf

services:
  console:
    image: webperf:dev
    build: *webperf-build

  api:
    image: webperf:dev
    build: *webperf-build

  scheduler:
    image: webperf:dev
    build: *webperf-build

  executor:
    image: webperf:dev
    build: *webperf-build

  probe:
    image: webperf-probe:dev
    build:
      context: ../../apps/probe-rs
      dockerfile: Dockerfile

  browser-audit-lighthouse:
    image: webperf-browser-audit-lighthouse:dev
    build:
      context: ../..
      dockerfile: apps/browser-audit-lighthouse/Dockerfile

  api-debug:
    image: webperf:dev
    build: *webperf-build

  browser-audit-debug:
    image: webperf:dev
    build: *webperf-build
