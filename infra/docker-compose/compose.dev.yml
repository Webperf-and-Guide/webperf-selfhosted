# Phase 2 of issue #14: all Bun services share one webperf image build.
# Only the api service defines a build; the other Bun services reference
# the same image: tag so Compose does not rebuild the same Dockerfile.
services:
  api:
    image: webperf:dev
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.webperf

  console:
    image: webperf:dev

  scheduler:
    image: webperf:dev

  executor:
    image: webperf:dev

  probe:
    image: webperf-probe:dev
    build:
      context: ../../apps/probe-rs
      dockerfile: Dockerfile

  browser-audit-lighthouse:
    image: webperf-browser-audit-lighthouse:dev
    build:
      context: ../..
      dockerfile: apps/browser-audit-lighthouse/Dockerfile

  api-debug:
    image: webperf:dev

  browser-audit-debug:
    image: webperf:dev
